# Tiny Tapeout project information
project:
  title:        "ultrasonic phased array sonar"      # Project title
  author:       "SiliconSonics"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A digital processing unit that processes PWM echo signals from sensors to calculate object distance, using one-hot encoding on the output pins to indicate the detected direction."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_siliconsonics"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "main.v"
    - "echo_timing.v"
    - "hardware_controller.v"
   # - "pdm_detectors.v"
   # - "multiplier.v"
   # - "min_finder.v"
   # - "shifter.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "start_measurement"
  ui[1]: "mic1_pdm"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: "restart_mic"

  # Outputs

  uo[0]: "echo_window_index[0]"
  uo[1]: "echo_window_index[1]"
  uo[2]: "echo_window_index[2]"
  uo[3]: "echo_window_index[3]"
  uo[4]: "echo_window_index[4]"
  uo[5]: "echo_window_index[5]"
  uo[6]: "echo_window_index[6]"
  uo[7]: "echo_window_index[7]"

  # Bidirectional pins

  uio[0]: "echo_window_index[8]"
  uio[1]: "echo_window_index[9]"
  uio[2]: "echo_window_index[10]"
  uio[3]: "echo_window_index[11]"
  uio[4]: "echo_found"
  uio[5]: "transducer_drive_a"
  uio[6]: transducer_drive_b"
  uio[7]: "mic_clk"

# Do not change!
yaml_version: 6
